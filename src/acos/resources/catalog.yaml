version: 0.1.0
modules:
- id: consulting_core
  version: 0.1.0
  trigger:
    operator: equals
    field: schema_version
    value: 1
  dependencies: []
  capabilities:
  - problem-framing
  - evidence-synthesis
  artifacts:
  - path: context/business_context.md
    template_id: notes
    ownership: human
  - path: framing/framing.yaml
    template_id: contract
    ownership: human
  - path: evidence/findings.md
    template_id: notes
    ownership: human
  - path: decision/recommendation.md
    template_id: notes
    ownership: human
  - path: delivery/delivery_contract.md
    template_id: notes
    ownership: human
  - path: handoff/runbook.md
    template_id: notes
    ownership: human
  playbooks:
  - research-impact-delivery.md
  gates:
  - id: discovery
    stage: discovery
    artifacts:
    - context/business_context.md
    required_fields: {}
    human_review: true
  - id: framing
    stage: framing
    artifacts:
    - framing/framing.yaml
    required_fields:
      framing/framing.yaml:
      - decision
      - owner
      - metric
      - unit
      - horizon
    human_review: true
  - id: diagnosis
    stage: diagnosis
    artifacts:
    - evidence/findings.md
    required_fields: {}
    human_review: true
  - id: execution
    stage: execution
    artifacts: []
    required_fields: {}
    human_review: true
  - id: validation
    stage: validation
    artifacts: []
    required_fields: {}
    human_review: true
  - id: delivery
    stage: delivery
    artifacts:
    - decision/recommendation.md
    - delivery/delivery_contract.md
    required_fields: {}
    human_review: true
  - id: handoff
    stage: handoff
    artifacts:
    - handoff/runbook.md
    required_fields: {}
    human_review: true
- id: data_analysis
  version: 0.1.0
  trigger:
    operator: any
    rules:
    - operator: contains
      field: data.sources
      value: csv
    - operator: contains
      field: data.sources
      value: excel
    - operator: contains
      field: data.sources
      value: parquet
    - operator: contains
      field: data.sources
      value: sql
    - operator: contains
      field: data.sources
      value: api
    - operator: contains
      field: data.sources
      value: postgresql
    - operator: contains
      field: data.sources
      value: bigquery
    - operator: contains
      field: data.sources
      value: snowflake
    - operator: equals
      field: data.characteristics.tabular
      value: true
  dependencies: []
  capabilities:
  - dataset-understanding
  artifacts:
  - path: data/data_contract.yaml
    template_id: data
    ownership: human
  - path: analysis/analysis_plan.md
    template_id: notes
    ownership: human
  playbooks:
  - data-understanding-analysis.md
  gates:
  - id: data-quality
    stage: diagnosis
    artifacts:
    - data/data_contract.yaml
    required_fields:
      data/data_contract.yaml:
      - grain
      - keys
      - coverage
      - quality
    human_review: true
  - id: data_analysis-review
    stage: validation
    artifacts:
    - analysis/analysis_plan.md
    required_fields: {}
    human_review: true
- id: research
  version: 0.1.0
  trigger:
    operator: contains
    field: engagement.delivery_modes
    value: research
  dependencies: []
  capabilities:
  - research-comparison
  artifacts:
  - path: analysis/research_plan.md
    template_id: notes
    ownership: human
  playbooks:
  - research-impact-delivery.md
  gates:
  - id: research-review
    stage: validation
    artifacts:
    - analysis/research_plan.md
    required_fields: {}
    human_review: true
- id: supervised_model
  version: 0.1.0
  trigger:
    operator: all
    rules:
    - operator: contains
      field: engagement.archetypes
      value: PREDICT
    - operator: any
      rules:
      - operator: equals
        field: data.characteristics.labeled
        value: 'yes'
      - operator: equals
        field: data.characteristics.labeled
        value: partial
    - operator: equals
      field: data.characteristics.supervised
      value: true
  dependencies:
  - data_analysis
  capabilities:
  - supervised-validation
  - leakage-audit
  - feature-design
  artifacts:
  - path: modeling/model_brief.md
    template_id: notes
    ownership: human
  - path: validation/model_validation.md
    template_id: notes
    ownership: human
  playbooks:
  - experiments-and-models.md
  gates:
  - id: supervised_model-review
    stage: validation
    artifacts:
    - modeling/model_brief.md
    required_fields: {}
    human_review: true
- id: forecast
